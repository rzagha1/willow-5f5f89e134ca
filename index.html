<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F8F7FC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16151D" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A little less to remember. Sleep, feeds, and everyday firsts, together.">
  <title>Eshel’s baby app</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="preload" href="./fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script src="./sync-config.js" defer></script>
  <script src="./sync.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header id="header"></header>
    <div id="warnings" class="warnings"></div>
    <main id="main" tabindex="-1"><div class="empty"><div class="illustration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.8 14.2A8 8 0 0 1 9.8 4.1a8 8 0 1 0 10 10.1Z M17 3v4m-2-2h4"/></svg></div><h1>A little moment…</h1><p>Getting your baby's day ready.</p></div></main>
    <nav id="nav" aria-label="Main navigation"></nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <button id="update" class="update" hidden>Update available, tap to refresh</button>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript>This app needs JavaScript to save your baby's moments. Enable JavaScript in Chrome, then reload.</noscript>
</body>
</html>
